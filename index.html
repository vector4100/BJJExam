<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaliação – Exame de Graduação</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f5;--card:#fff;--ink:#18181b;--mut:#71717a;--line:#e4e4e7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f11;--card:#1c1c20;--ink:#f4f4f5;--mut:#a1a1aa;--line:#34343a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:1rem;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:.15s}
.card.done{border-color:#22c55e;background:color-mix(in srgb,#22c55e 9%,var(--card))}
.mut{color:var(--mut)}
.cb{position:relative;width:3rem;height:3rem;flex:none}
.cb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.cb span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border:2px solid var(--mut);border-radius:.75rem;font-weight:700;color:var(--mut);background:var(--card);transition:.12s}
.cb input:checked+span{background:var(--c);border-color:var(--c);color:var(--t)}
.cb input:focus-visible+span{outline:3px solid var(--c);outline-offset:2px}
.btn{border:2px solid var(--line);background:var(--card);border-radius:.75rem;padding:.6rem 1rem;font-weight:600}
</style>
</head>
<body>
<div id="app" class="max-w-3xl mx-auto"></div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 p-4 overflow-y-auto">
  <div class="card max-w-xl mx-auto my-6 p-5">
    <h2 class="text-xl font-bold mb-3">Resumo da Avaliação</h2>
    <pre id="sum" class="whitespace-pre-wrap text-sm p-3 rounded-lg border border-[var(--line)]" style="font-family:inherit"></pre>
    <div class="flex gap-2 mt-4 flex-wrap">
      <button id="copy" class="btn text-white" style="background:#16a34a;border-color:#16a34a">Copiar para WhatsApp</button>
      <a id="wa" target="_blank" rel="noopener" class="btn">Abrir WhatsApp</a>
      <button id="close" class="btn">Fechar</button>
    </div>
  </div>
</div>
<script>
const R={academia:"De La Riva Floripa",documento:"Requisitos para exames de graduação",faixas:[
{faixa:"Cinza",categoria:"Infantil/Juvenil",idade_requisito:"Até 15 anos e 11 meses",tempo_minimo_treino:"06 meses",r:[["ROLAMENTOS (Frente, lado e costas)","03"],["FUGA DE QUADRIL (Camarão)","01"],["GUARDA FECHADA","01"],["ABERTURA DE GUARDA","01"],["PASSAGEM DE GUARDA","01"],["MATA-LEÃO","01"],["ATAQUE DE GOLA (Estrangulamento)","01"],["CEM QUILOS","01"],["JOELHO NA BARRIGA","01"],["MONTADA","01"],["SAIDA MONTADA","01"],["PEGADA PELAS COSTAS","01"],["AMARRAR A FAIXA E DOBRAR O KIMONO",null]]},
{faixa:"Amarela",categoria:"Infantil/Juvenil",idade_requisito:"De 07 anos até 15 anos e 11 meses",tempo_minimo_treino:"01 ano na faixa anterior",r:[["ROLAMENTOS (Frente, lado e costas)","03"],["FUGA DE QUADRIL (Camarão)","01"],["ATAQUE NA GUARDA FECHADA","01"],["GUARDA ABERTA","01"],["MEIA GUARDA","01"],["ABERTURA DE GUARDA","01"],["PASSAGEM DE GUARDA","01"],["MATA-LEÃO","01"],["ATAQUE DE GOLA (Estrangulamento)","01"],["CEM QUILOS","01"],["JOELHO NA BARRIGA","01"],["ATAQUE NA MONTADA","01"],["SAIDA MONTADA","01"],["NORTE-SUL","01"],["AMARRAR A FAIXA E DOBRAR O KIMONO",null]]},
{faixa:"Laranja",categoria:"Infantil/Juvenil",idade_requisito:"De 10 anos até 15 anos e 11 meses",tempo_minimo_treino:"01 ano na faixa anterior",r:[["ROLAMENTOS (Frente, lado e costas)","03"],["FUGA DE QUADRIL (Camarão)","01"],["ATAQUE NA GUARDA FECHADA","01"],["GUARDA ABERTA","01"],["RASPAGEM DE GUARDA ABERTA OU FECHADA","01"],["MEIA GUARDA","01"],["RASPAGEM PARTINDO DA MEIA GUARDA","01"],["ABERTURA DE GUARDA","02"],["PASSAGEM DE GUARDA","02"],["MATA-LEÃO","01"],["ARM-LOCK NA GUARDA e DEFESA","01"],["TRIANGULO e DEFESA","01"],["ATAQUE DE GOLA (Estrangulamento)","02"],["CHAVE AMERICANA","01"],["CHAVE KIMURA","01"],["CEM QUILOS","01"],["SAÍDA DO CEM QUILOS","01"],["JOELHO NA BARRIGA","01"],["SAÍDA DO JOELHO NA BARRIGA","01"],["ATAQUE NA MONTADA","02"],["SAIDA MONTADA","02"],["NORTE-SUL","01"],["SAÍDA DO NORTE-SUL","01"]]},
{faixa:"Verde",categoria:"Infantil/Juvenil",idade_requisito:"De 13 anos até 15 anos e 11 meses",tempo_minimo_treino:"01 ano na faixa anterior",r:[["HISTÓRICO - ATUALIDADES - PONTUAÇÃO",null],["DEFESA PESSOAL","01"],["ROLAMENTOS E FUGA DE QUADRIL","TODOS"],["QUEDAS COM NOME","02"],["RASPAGEM GUARDA-FECHADA","01"],["RASPAGEM GUARDA-ABERTA","01"],["RASPAGEM MEIA-GUARDA","01"],["ARM-LOCK NA GUARDA E DEFESA","01"],["TRIÂNGULO E DEFESA","01"],["MATA-LEÃO E DEFESA","01"],["AMERICANA","01"],["KIMURA","01"],["RELÓGIO","01"],["ESTRANGULAMENTO MONTADA","01"],["ESTRANGULAMENTO NAS COSTAS","01"],["PASSAGEM DE GUARDA","02"],["TÉCNICA PARA CHEGAR À MONTADA","01"],["SAIDA MONTADA","02"],["SAIDA CEM QUILOS","01"],["SAIDA JOELHO NA BARRIGA","01"],["SAIDA NORTE-SUL","01"]]},
{faixa:"Azul",categoria:"Adulto",idade_requisito:"Mínima: 16 anos",tempo_minimo_treino:"01 ano ininterrupto na faixa branca",r:[["HISTÓRICO – ATUALIDADES – CLÍNICA DE ARBITRAGEM",null],["DEFESA PESSOAL","2"],["ROLAMENTOS E FUGA DE QUADRIL","TODOS"],["QUEDAS COM NOME","2"],["RASPAGEM GUARDA-FECHADA","2"],["RASPAGEM GUARDA-ABERTA","2"],["RASPAGEM MEIA-GUARDA","2"],["ARM-LOCK NA GUARDA","2"],["DEFESA DO ARM-LOCK NA GUARDA","1"],["TRIÂNGULO","1"],["DEFESA TRIÂNGULO","1"],["MATA-LEÃO","1"],["DEFESA MATA-LEÃO","1"],["AMERICANA","1"],["KIMURA","1"],["RELÓGIO","2"],["OMOPLATA","1"],["ESTRANGULAMENTO NA MONTADA","2"],["ESTRANGULAMENTO NAS COSTAS","2"],["CHAVE DE PÉ (Reta)","1"],["PASSAGEM DE GUARDA","2"],["TÉCNICAS PARA CHEGAR À MONTADA","2"],["SAIDA MONTADA","2"],["SAIDA CEM QUILOS","2"],["SAIDA JOELHO NA BARRIGA","1"],["SAIDA NORTE – SUL","1"]]},
{faixa:"Roxa",categoria:"Adulto",idade_requisito:"Mínima: 16 anos",tempo_minimo_treino:"02 anos ininterruptos na faixa azul",r:[["HISTÓRICO – ATUALIDADES – CLÍNICA DE ARBITRAGEM",null],["DEFESA PESSOAL","4"],["ROLAMENTOS E FUGA DE QUADRIL","TODOS"],["QUEDAS COM NOME","3"],["RASPAGEM GUARDA-FECHADA","3"],["RASPAGEM GUARDA-ABERTA","3"],["RASPAGEM MEIA-GUARDA","3"],["RASPAGEM GUARDA-ARANHA E/OU DE LAPELA","2"],["RASPAGEM COM GANCHO DE LA RIVA E/OU BERIMBOLO","2"],["ARM-LOCK NA GUARDA","3"],["DEFESA DE ARM-LOCK NA GUARDA","1"],["TRIÂNGULO","2"],["DEFESA DE TRIÂNGULO","2"],["AMERICANA","2"],["KIMURA","2"],["OMOPLATA","2"],["DEFESA DE OMOPLATA","2"],["ARCO E FLEXA","1"],["ARM-LOCK INVERTIDO","1"],["RELÓGIO","3"],["DEFESA DE RELÓGIO","1"],["GUILHOTINA","1"],["DEFESA DE GUILHOTINA","1"],["MÃO-DE-VACA","1"],["CHAVE DE PÉ (Reta)","1"],["PASSAGEM DE GUARDA","3"],["TÉCNICAS PARA OBTER AS COSTAS","3"],["TÉCNICAS PARA CHEGAR À MONTADA","3"],["SAIDA MONTADA","3"],["SAIDA CEM QUILOS","3"],["SAIDA JOELHO NA BARRIGA","2"],["SAIDA NORTE-SUL","1"]]},
{faixa:"Marrom",categoria:"Adulto",idade_requisito:"Mínima: 18 anos",tempo_minimo_treino:"02 anos ininterruptos na faixa roxa",r:[["HISTÓRICO – ATUALIDADES – CLÍNICA DE ARBITRAGEM - DIDÁTICA",null],["DEFESA PESSOAL","5"],["ROLAMENTOS E FUGA DE QUADRIL","TODOS"],["QUEDAS COM NOME","5"],["RASPAGEM GUARDA-FECHADA","4"],["RASPAGEM GUARDA-ABERTA","4"],["RASPAGEM MEIA-GUARDA","4"],["RASPAGEM GUARDA-ARANHA E/OU DE LAPELA","2"],["RASPAGEM COM GANCHO DE LA RIVA E/OU BERIMBOLO","2"],["RASPAGEM GUARDA-X","2"],["ARM-LOCK NA GUARDA","4"],["DEFESA DE ARM-LOCK NA GUARDA","2"],["ARM-LOCK INVERTIDO","2"],["TRIÂNGULO","4"],["DEFESA DE TRIÂNGULO","2"],["TRIÂNGULO INVERTIDO","1"],["TRIÂNGULO DE BRAÇO","1"],["AMERICANA","4"],["KIMURA","4"],["OMOPLATA","4"],["DEFESA DE OMOPLATA","2"],["OMOPLATA INVERTIDA","1"],["ARCO E FLEXA","2"],["RELÓGIO","3"],["DEFESA DE RELÓGIO","2"],["GUILHOTINA","2"],["DEFESA GUILHOTINA","1"],["KATAGATAME","1"],["MÃO – DE – VACA","4"],["PATA – DE – VACA","4"],["LEG-LOCK","4"],["DEFESA DE LEG-LOCK","1"],["CHAVE DE BÍCEPS","1"],["CHAVE DE PÉ (Reta)","2"],["CHAVE DE PANTURRILHA","1"],["PASSAGEM DE GUARDA","4"],["PASSAGEM PARTINDO DA MEIA-GUARDA","2"],["TÉCNICAS PARA OBTER AS COSTAS","4"],["TÉCNICAS PARA CHEGAR À MONTADA","4"],["SAIDA MONTADA","4"],["SAIDA CEM QUILOS","4"],["SAIDA JOELHO NA BARRIGA","2"],["SAIDA NORTE-SUL","1"]]},
{faixa:"Preta",categoria:"Adulto",idade_requisito:"Mínima: 19 anos",tempo_minimo_treino:"02 anos ininterruptos na faixa marrom",r:[["HISTÓRICO – ATUALIDADES – CLÍNICA DE ARBITRAGEM – DIDÁTICA – SISTEMA DE GRADUAÇÃO",null],["DEFESA PESSOAL","6"],["ROLAMENTOS E FUGA DE QUADRIL","TODOS"],["QUEDAS COM NOME","6"],["RASPAGEM GUARDA-FECHADA","4"],["RASPAGEM GUARDA-ABERTA","4"],["RASPAGEM MEIA-GUARDA","4"],["RASPAGEM GUARDA-ARANHA E/OU DE LAPELA","2"],["RASPAGEM COM GANCHO DE LA RIVA E/OU BERIMBOLO","2"],["RASPAGEM GUARDA-X","2"],["ARM-LOCK NA GUARDA","4"],["DEFESA DE ARM-LOCK NA GUARDA","2"],["ARM-LOCK INVERTIDO","2"],["TRIÂNGULO","4"],["DEFESA DE TRIÂNGULO","2"],["TRIÂNGULO INVERTIDO","1"],["TRIÂNGULO DE BRAÇO","1"],["AMERICANA","4"],["KIMURA","4"],["OMOPLATA","4"],["DEFESA DE OMOPLATA","2"],["OMOPLATA INVERTIDA","1"],["ARCO E FLEXA","3"],["RELÓGIO","3"],["DEFESA DE RELÓGIO","2"],["GUILHOTINA","2"],["DEFESA GUILHOTINA","1"],["KATAGATAME","1"],["MÃO – DE – VACA","4"],["PATA – DE – VACA","4"],["LEG-LOCK","4"],["DEFESA DE LEG-LOCK","1"],["CHAVE DE BÍCEPS","1"],["CHAVE DE PÉ (Reta)","2"],["CHAVE DE PANTURRILHA","1"],["PASSAGEM DE GUARDA","4"],["PASSAGEM PARTINDO DA MEIA - GUARDA","3"],["TÉCNICAS PARA OBTER AS COSTAS","4"],["TÉCNICAS PARA CHEGAR À MONTADA","4"],["SAIDA MONTADA","4"],["SAIDA CEM QUILOS","4"],["SAIDA JOELHO NA BARRIGA","2"],["SAIDA NORTE-SUL","1"]]}
]};
// Mesma estrutura do JSON original (ordem gerada pela posição na lista)
const dadosExame={academia:R.academia,documento:R.documento,faixas:R.faixas.map(f=>({faixa:f.faixa,categoria:f.categoria,idade_requisito:f.idade_requisito,tempo_minimo_treino:f.tempo_minimo_treino,requisitos:f.r.map((x,i)=>({ordem:i+1,descricao:x[0],quantidade:x[1]}))}))};

const THEME={Cinza:["#6B7280","#fff"],Amarela:["#EAB308","#18181b"],Laranja:["#EA580C","#fff"],Verde:["#16A34A","#fff"],Azul:["#2563EB","#fff"],Roxa:["#7C3AED","#fff"],Marrom:["#78350F","#fff"],Preta:["#18181B","#fff"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nBoxes=r=>{const q=r.quantidade;if(q===null||q==="TODOS")return 1;const n=parseInt(q,10);return n>0?n:1};
let S={alunos:["",""],dupla:true,faixa:null,checks:{},res:{}};
try{const s=JSON.parse(localStorage.getItem("exame-v2")||"null");if(s)S=s}catch(e){}
const save=()=>{try{localStorage.setItem("exame-v2",JSON.stringify(S))}catch(e){}};
const cur=()=>dadosExame.faixas.find(f=>f.faixa===S.faixa);
const N=()=>S.dupla?2:1, idx=()=>[...Array(N()).keys()];
const nome=a=>S.alunos[a].trim()||("Aluno "+(a+1));
const key=(f,r,a)=>f.faixa+"|"+r.ordem+"|"+a;
const getC=(f,r,a)=>{const k=key(f,r,a);if(!S.checks[k])S.checks[k]=Array(nBoxes(r)).fill(false);return S.checks[k]};
function stats(f,a){let t=0,d=0;f.requisitos.forEach(r=>{const c=getC(f,r,a);t+=c.length;d+=c.filter(Boolean).length});return{t,d,p:t?Math.round(d/t*100):0}}

function home(){
  document.documentElement.style.removeProperty("--c");
  const grp=(cat,title)=>`<h2 class="text-lg font-bold mt-6 mb-3">${title}</h2><div class="grid grid-cols-2 gap-3">`+
   dadosExame.faixas.filter(f=>f.categoria===cat).map(f=>{const[c,t]=THEME[f.faixa];
   return `<button data-faixa="${f.faixa}" class="rounded-2xl p-5 text-left shadow-md active:scale-95 transition" style="background:${c};color:${t};${f.faixa==="Preta"?"box-shadow:inset 0 -6px 0 #dc2626":""}"><div class="text-xl font-extrabold">${f.faixa}</div><div class="text-xs opacity-90 mt-1">${f.requisitos.length} requisitos</div></button>`}).join("")+`</div>`;
  const inp=a=>`<div class="mt-2"><label class="block text-sm font-semibold" for="al${a}">Nome do Aluno ${a+1}</label><input id="al${a}" data-a="${a}" class="mt-1 w-full card px-4 py-3 text-base" style="background:var(--card);color:var(--ink)" placeholder="Digite o nome" value="${esc(S.alunos[a])}"></div>`;
  $("app").innerHTML=`<header class="p-5 pb-2"><h1 class="text-2xl font-extrabold leading-tight">Sistema de Avaliação - Exame de Graduação</h1><p class="mut mt-1">De La Riva Floripa</p>
  <div class="mt-4">${inp(0)}<div id="b2">${S.dupla?inp(1):""}</div></div>
  <label class="flex items-center gap-2 mt-3 text-sm font-semibold"><input type="checkbox" id="dupla" class="w-5 h-5" ${S.dupla?"checked":""}> Avaliar em dupla</label></header>
  <main class="p-5 pt-0">${grp("Infantil/Juvenil","Infantil / Juvenil")}${grp("Adulto","Adulto")}</main>`;
  document.querySelectorAll("[data-a]").forEach(i=>i.oninput=e=>{S.alunos[+i.dataset.a]=e.target.value;save()});
  $("dupla").onchange=e=>{S.dupla=e.target.checked;save();home()};
  document.querySelectorAll("[data-faixa]").forEach(b=>b.onclick=()=>{S.faixa=b.dataset.faixa;save();exam();scrollTo(0,0)});
}

function exam(){
  const f=cur(),[c,t]=THEME[f.faixa],gold=f.faixa==="Preta";
  document.documentElement.style.setProperty("--c",gold?"#b45309":c);document.documentElement.style.setProperty("--t","#fff");
  const cards=f.requisitos.map(r=>{
    const todos=r.quantidade==="TODOS";
    const rows=idx().map(a=>{const c2=getC(f,r,a);
      return `<div class="flex items-center gap-2 flex-wrap">${N()>1?`<span class="text-xs font-bold mut w-16 truncate">${esc(nome(a))}</span>`:""}`+
      c2.map((v,i)=>`<label class="cb"><input type="checkbox" data-r="${r.ordem}" data-a="${a}" data-i="${i}" ${v?"checked":""} aria-label="${esc(r.descricao)} – ${esc(nome(a))} ${c2.length>1?i+1:""}"><span>${c2.length>1?i+1:"✓"}</span></label>`).join("")+`</div>`}).join("");
    return `<article class="card p-4 flex flex-col sm:flex-row sm:items-center gap-3 justify-between" id="c-${r.ordem}">
      <div class="flex gap-3 items-start"><span class="mut font-bold text-sm pt-0.5 w-6">${r.ordem}</span><div class="font-semibold leading-snug">${esc(r.descricao)}${todos?' <span class="text-xs font-bold px-2 py-0.5 rounded-full align-middle ml-1" style="background:var(--c);color:var(--t)">TODOS</span>':""}</div></div>
      <div class="flex flex-col gap-2">${rows}</div></article>`}).join("");
  const bars=idx().map(a=>`<div class="mb-1.5"><div class="flex justify-between text-xs font-bold mb-0.5"><span class="truncate">${esc(nome(a))}: <span id="pt${a}"></span></span><span id="pp${a}"></span></div><div class="h-2.5 rounded-full overflow-hidden" style="background:var(--line)"><div id="pb${a}" class="h-full rounded-full transition-all" style="background:${gold?"#d4a017":c};width:0"></div></div></div>`).join("");
  const resBlk=idx().map(a=>`<div class="card p-4"><div class="font-bold mb-2">${esc(nome(a))} <span class="mut text-sm font-normal" id="rp${a}"></span></div><button class="btn all w-full mb-3" data-a="${a}"></button><div class="grid grid-cols-2 gap-3">
    <button class="rb rounded-xl py-4 font-extrabold border-2" data-a="${a}" data-res="Aprovado">Aprovado</button>
    <button class="rb rounded-xl py-4 font-extrabold border-2" data-a="${a}" data-res="Reprovado">Reprovado</button></div></div>`).join("");
  $("app").innerHTML=`<header class="p-5 pt-6" style="background:${c};color:${t};${gold?"border-bottom:6px solid #d4a017":""}">
    <div class="flex gap-2 flex-wrap mb-4"><button id="back" class="btn" style="background:rgba(255,255,255,.18);border-color:rgba(128,128,128,.4);color:${t}">← Voltar para Faixas</button><button id="reset" class="btn" style="background:rgba(255,255,255,.18);border-color:rgba(128,128,128,.4);color:${t}">Limpar Avaliação</button></div>
    <h1 class="text-3xl font-extrabold">Faixa ${f.faixa}</h1>
    <div class="mt-2 text-sm space-y-0.5 opacity-95"><div><b>Categoria:</b> ${f.categoria}</div><div><b>Idade:</b> ${f.idade_requisito}</div><div><b>Tempo mínimo de treino:</b> ${f.tempo_minimo_treino}</div><div><b>Alunos:</b> ${idx().map(a=>esc(nome(a))).join(" e ")}</div></div></header>
  <div class="sticky top-0 z-20 px-5 py-2 border-b" style="background:var(--bg);border-color:var(--line);padding-top:calc(.5rem + env(safe-area-inset-top,0px))">${bars}</div>
  <main class="p-4 space-y-3">${cards}<h2 class="text-lg font-bold pt-4">Resultado final</h2>${resBlk}<button id="fin" class="w-full rounded-2xl py-4 text-lg font-extrabold shadow-lg mt-2" style="background:${c};color:${t}">Finalizar e Gerar Resumo</button></main>`;
  f.requisitos.forEach(r=>upCard(f,r));idx().forEach(upBar);upRes();
  $("back").onclick=()=>{S.faixa=null;save();home()};
  $("reset").onclick=()=>{if(confirm("Limpar todas as marcações e resultados desta faixa?")){[0,1].forEach(a=>{f.requisitos.forEach(r=>delete S.checks[key(f,r,a)]);delete S.res[f.faixa+"|"+a]});save();exam()}};
  $("fin").onclick=summary;
  $("app").onchange=e=>{const i=e.target;if(i.dataset.r===undefined)return;const r=f.requisitos.find(x=>x.ordem==i.dataset.r),a=+i.dataset.a;getC(f,r,a)[+i.dataset.i]=i.checked;save();upCard(f,r);upBar(a)};
  $("app").onclick=e=>{const m=e.target.closest(".all");if(m){const a=+m.dataset.a,s0=stats(f,a),full=s0.d===s0.t;f.requisitos.forEach(r=>{S.checks[key(f,r,a)]=Array(nBoxes(r)).fill(!full);upCard(f,r)});document.querySelectorAll(`input[data-r][data-a="${a}"]`).forEach(i=>i.checked=!full);save();upBar(a);upRes();return}const b=e.target.closest(".rb");if(!b)return;const k=f.faixa+"|"+b.dataset.a;S.res[k]=S.res[k]===b.dataset.res?null:b.dataset.res;save();upRes()};
}
function upCard(f,r){const el=$("c-"+r.ordem);if(el)el.classList.toggle("done",idx().every(a=>getC(f,r,a).every(Boolean)))}
function upBar(a){const s=stats(cur(),a);$("pt"+a).textContent=`${s.d} / ${s.t} concluídos`;$("pp"+a).textContent=s.p+"%";$("pb"+a).style.width=s.p+"%"}
function upRes(){const f=cur();document.querySelectorAll(".rb").forEach(b=>{const on=S.res[f.faixa+"|"+b.dataset.a]===b.dataset.res,ap=b.dataset.res==="Aprovado",col=ap?"#16a34a":"#dc2626";b.style.background=on?col:"var(--card)";b.style.color=on?"#fff":col;b.style.borderColor=col});idx().forEach(a=>{const s=stats(f,a);$("rp"+a).textContent=`(${s.p}% das técnicas marcadas)`;document.querySelector(`.all[data-a="${a}"]`).textContent=s.d===s.t?"Desmarcar tudo":"Marcar tudo como feito"})}

function summary(){
  const f=cur(),dt=new Date().toLocaleDateString("pt-BR");
  const blocks=idx().map(a=>{const s=stats(f,a),pend=[];
    f.requisitos.forEach(r=>{const c=getC(f,r,a),m=c.filter(x=>!x).length;if(m)pend.push(`• ${r.descricao}`+(c.length>1?` (${c.length-m}/${c.length})`:""))});
    const res=S.res[f.faixa+"|"+a];
    return `*${nome(a)}*\nResultado: ${res==="Aprovado"?"✅ APROVADO":res==="Reprovado"?"❌ REPROVADO":"não definido"}\nTécnicas marcadas: ${s.p}% (${s.d}/${s.t})\n`+(pend.length?`Pendências:\n${pend.join("\n")}`:"Nenhuma pendência.")}).join("\n\n――――――――\n\n");
  const txt=`🥋 *Exame de Graduação – De La Riva Floripa*\nFaixa avaliada: ${f.faixa}\nData: ${dt}\n\n${blocks}`;
  $("sum").textContent=txt;$("wa").href="https://wa.me/?text="+encodeURIComponent(txt);$("modal").classList.remove("hidden");
  $("copy").onclick=async()=>{try{await navigator.clipboard.writeText(txt);$("copy").textContent="Copiado ✓"}catch(e){const r=document.createRange();r.selectNodeContents($("sum"));getSelection().removeAllRanges();getSelection().addRange(r);$("copy").textContent="Selecionado – copie manualmente"}};
  $("close").onclick=()=>{$("modal").classList.add("hidden");$("copy").textContent="Copiar para WhatsApp"};
}
S.faixa&&cur()?exam():(S.faixa=null,home());
</script>
